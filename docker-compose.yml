services:
  cassandra:
    image: cassandra:5.0
    container_name: game-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
